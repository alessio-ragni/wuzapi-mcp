# Two services:
#   wuzapi      keeps the WhatsApp session (a linked device on your account).
#   wuzapi-mcp  archives every message, serves the status/QR page and the MCP endpoint for Claude.
#
# Published ports are bound to 127.0.0.1: reachable from this machine only, never from the network.
name: wuzapi-mcp

services:
  wuzapi:
    image: asternic/wuzapi:1.1.0
    # Appended to the image entrypoint. SQLite and the WhatsApp session live in /data.
    # -skipmedia: webhooks carry media references only; files are downloaded when Claude asks.
    command: ["-datadir=/data", "-color=false", "-skipmedia"]
    environment:
      WUZAPI_ADMIN_TOKEN: ${WUZAPI_ADMIN_TOKEN:?set WUZAPI_ADMIN_TOKEN in .env}
      WUZAPI_GLOBAL_ENCRYPTION_KEY: ${WUZAPI_GLOBAL_ENCRYPTION_KEY:?set WUZAPI_GLOBAL_ENCRYPTION_KEY in .env}
      WUZAPI_GLOBAL_HMAC_KEY: ${WUZAPI_GLOBAL_HMAC_KEY:?set WUZAPI_GLOBAL_HMAC_KEY in .env}
      # Every event goes to wuzapi-mcp, signed with the HMAC key above.
      WUZAPI_GLOBAL_WEBHOOK: http://wuzapi-mcp:3000/webhook/wuzapi
      WEBHOOK_FORMAT: json
      SESSION_DEVICE_NAME: ${SESSION_DEVICE_NAME:-wuzapi-mcp}
      # Keeps notifications on the phone: the linked device does not mark you as online.
      WUZAPI_AUTO_PRESENCE: unavailable
      TZ: ${TZ:-UTC}
    volumes:
      - wuzapi-data:/data
      - wuzapi-files:/app/files
    ports:
      - "127.0.0.1:${WUZAPI_HOST_PORT:-8090}:8080"
    restart: unless-stopped

  wuzapi-mcp:
    # The published image. `docker compose up -d --build` builds it from this checkout instead.
    image: ghcr.io/alessio-ragni/wuzapi-mcp:${WUZAPI_MCP_VERSION:-latest}
    build: .
    depends_on:
      - wuzapi
    environment:
      WUZAPI_URL: http://wuzapi:8080
      WUZAPI_ADMIN_TOKEN: ${WUZAPI_ADMIN_TOKEN}
      WUZAPI_USER_NAME: ${WUZAPI_USER_NAME:-owner}
      WUZAPI_USER_TOKEN: ${WUZAPI_USER_TOKEN:?set WUZAPI_USER_TOKEN in .env}
      WUZAPI_GLOBAL_HMAC_KEY: ${WUZAPI_GLOBAL_HMAC_KEY}
      WUZAPI_HISTORY_PER_CHAT: ${WUZAPI_HISTORY_PER_CHAT:-0}
      WUZAPI_SYNC_DAYS: ${WUZAPI_SYNC_DAYS:-365}
      PUBLIC_URL: http://127.0.0.1:${MCP_HOST_PORT:-8091}
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-off}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      WHISPER_URL: ${WHISPER_URL:-}
      TZ: ${TZ:-UTC}
      # The folder files can be sent from and the one downloads land in, as paths on this computer.
      # Inside the container they are mounted at /files and /downloads; the server maps one to the other.
      FILES_ROOT: ${FILES_ROOT:-${HOME}}
      FILES_MOUNT: /files
      DOWNLOADS_DIR: ${DOWNLOADS_DIR:-${HOME}/Downloads/wuzapi-mcp}
      DOWNLOADS_MOUNT: /downloads
    volumes:
      - mcp-data:/data
      # Your home folder (or FILES_ROOT from .env), read-only: what send_file and send_voice can read.
      - ${FILES_ROOT:-${HOME}}:/files:ro
      # Downloaded media lands here, on your computer.
      - ${DOWNLOADS_DIR:-${HOME}/Downloads/wuzapi-mcp}:/downloads
    ports:
      - "127.0.0.1:${MCP_HOST_PORT:-8091}:3000"
    restart: unless-stopped

volumes:
  wuzapi-data:
  wuzapi-files:
  mcp-data:
